name: build-data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'split_zstd.py'
      - '.github/workflows/build.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd

      - name: 下载数据（11 年）
        run: |
          mkdir -p raw
          cd raw
          base="https://github.com/Renhuai123/ziwei-doushu/releases/download/v4.0-13d"
          for y in $(seq 2000 2010); do
            curl -sL -o "year-${y}.jsonl.zst" "${base}/year-${y}.jsonl.zst" &
          done
          wait
          ls -lh
          du -sh .

      - name: 分片压缩
        run: python split_zstd.py

      - name: 统计体积
        run: |
          du -sh data
          echo "文件数: $(ls data | wc -l)"
          ls -lh data | head -5

      - name: 部署到 Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./data
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
